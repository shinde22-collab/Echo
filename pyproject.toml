[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-extraction"
version = "1.0.0"
description = "Query-efficient black-box model extraction and an interactive research observatory"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4", "pandas==3.0.6", "scikit-learn==1.8.0", "matplotlib==3.10.7"]

[project.scripts]
echo-experiment = "echo.experiment:main"
echo-oracle = "echo.server:main"

[tool.setuptools.packages.find]
where = ["src"]
